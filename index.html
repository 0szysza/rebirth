  <main class="page-shell">

      <div class="selector-controls">
    <div class="snapshot-row">
      <div class="snapshot-label"><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg><label for="snapshot">Counts recorded at</label><button class="help-tip" type="button" aria-label="About the recorded time" aria-describedby="snapshot-help">?<span class="help-tip__bubble" id="snapshot-help" role="tooltip">Enter the rebirth counts you had at this time. This saved starting point keeps your finish time fixed. Estimates assume you keep rebirthing at the entered pace.</span></button></div>
      <div class="field date-control">
        <input id="snapshot" type="text" readonly aria-haspopup="dialog" aria-controls="snapshot-picker" aria-expanded="false" autocomplete="off">
        <button class="date-control__open" type="button" data-date-for="snapshot" aria-label="Choose recorded date and time" aria-haspopup="dialog" aria-controls="snapshot-picker" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#icon-calendar"></use></svg></button>
        <div class="date-picker" id="snapshot-picker" role="dialog" aria-label="Recorded date and time" hidden></div>
      </div>
    </div>
      <div class="account-selector__buttons" role="group" aria-label="Number of accounts">

    <div class="accounts-grid" id="accounts-grid" role="group" aria-label="Account estimates" data-count="2"></div>
